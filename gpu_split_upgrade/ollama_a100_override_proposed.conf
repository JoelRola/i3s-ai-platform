[Service]
# Proposed replacement for /etc/systemd/system/ollama.service.d/override.conf.
# Existing operational settings are retained; apply only after qwen3.5 download completes.
Environment="OLLAMA_MODELS=/mnt/ai-data/ollama/models"
Environment="OLLAMA_HOST=127.0.0.1:11434"
Environment="OLLAMA_MAX_LOADED_MODELS=1"
Environment="OLLAMA_NUM_PARALLEL=2"
Environment="OLLAMA_KEEP_ALIVE=30m"
Environment="CUDA_VISIBLE_DEVICES=GPU-f60893db-9b34-48da-859c-ad6639f545ef"
Environment="OLLAMA_LLM_LIBRARY=cuda_v12"
